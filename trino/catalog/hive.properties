# ---------------------------------------------------------------------------
# Conector Hive de Trino apuntando a MinIO (S3) con metastore en fichero.
#
# El catalogo se llamara "hive" (el nombre del fichero es el nombre del catalogo).
# Equivalente SQL:  SELECT * FROM hive.default.ventas;
#
# IMPORTANTE (Trino >= 4xx): las propiedades antiguas `hive.s3.*` SE ELIMINARON.
# Ahora se usa el fichero-sistema nativo `fs.s3.enabled=true` + propiedades `s3.*`.
# Si usas nombres antiguos el conector ni arranca ("Configuration property ... was not used").
#
# NOTA: Trino no hace sustitucion de variables de entorno en este fichero,
#       asi que las credenciales estan fijadas aqui. Si cambias
#       MINIO_ROOT_USER / MINIO_ROOT_PASSWORD en el .env, cambialas aqui tambien.
# ---------------------------------------------------------------------------

connector.name=hive

# --- Metastore en fichero (sin necesidad de un servicio Hive extra) ---
hive.metastore=file
hive.metastore.catalog.dir=file:///var/lib/trino/metastore

# --- Activar los sistemas de ficheros que vamos a usar ---
# fs.hadoop.enabled es OBLIGATORIO para el metastore en fichero: la ruta
# file:///... se resuelve con el sistema de ficheros de Hadoop (LocalFileSystem).
# Sin esta linea, Trino falla con:
#   "No factory for location: file:///var/lib/trino/metastore"
fs.hadoop.enabled=true
fs.s3.enabled=true

# --- Acceso a MinIO como si fuera S3 ---
# s3.endpoint debe ser una URL completa: el esquema (http/https) decide si hay TLS.
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=minioadmin

# --- Permitir escribir/crear tablas externas (no gestionadas) ---
hive.non-managed-table-writes-enabled=true
